name: Publicar SucreExpress en Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construir y publicar API
        uses: docker/build-push-action@v6
        with:
          context: ./sucrexpress-nest
          file: ./sucrexpress-nest/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sucrexpress-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sucrexpress-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construir y publicar web
        uses: docker/build-push-action@v6
        with:
          context: ./sucrexpress-next
          file: ./sucrexpress-next/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sucrexpress-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sucrexpress-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_NEST_API_URL=/backend
            NEXT_PUBLIC_GOOGLE_MAPS_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
